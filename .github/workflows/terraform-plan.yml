name: terraform-plan

# Runs on every PR to main: static checks for everything, then a plan for each changed layer.
on:
  pull_request:
    branches:
      - main

# Default for all jobs: read only. Jobs add only what they need.
permissions:
  contents: read

env:
  TF_VERSION: "1.17.1"
  TFLINT_VERSION: "v0.65.0"
  TF_IN_AUTOMATION: "true"

# A new push to the same PR cancels the older run.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt, validate, tflint, checkov
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved, a SHA cannot).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate (every root)
        run: |
          for dir in bootstrap modules/tags envs/*/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Checkov (policy as code)
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: .
          config_file: .checkov.yaml

  detect:
    name: detect changed layers
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.changes.outputs.layers }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Output: JSON list like [{"dir":"envs/dev/01-network","env":"dev"}]
      # A change to modules/tags affects every layer, so all layers are planned.
      - name: Find changed layers
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "$base" "${{ github.sha }}")

          if echo "$files" | grep -q '^modules/tags/'; then
            dirs=$(ls -d envs/*/*)
          else
            dirs=$(echo "$files" | grep '^envs/' | cut -d/ -f1-3 | sort -u || true)
          fi

          layers="[]"
          for dir in $dirs; do
            if [ -d "$dir" ]; then
              env=$(echo "$dir" | cut -d/ -f2)
              layers=$(echo "$layers" | jq -c --arg dir "$dir" --arg env "$env" '. + [{dir: $dir, env: $env}]')
            fi
          done

          echo "Changed layers: $layers"
          echo "layers=$layers" >> "$GITHUB_OUTPUT"

  plan:
    name: plan ${{ matrix.layer.dir }}
    needs: [checks, detect]
    if: needs.detect.outputs.layers != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # request the GitHub OIDC token for azure/login
      pull-requests: write  # post the plan as a PR comment
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.detect.outputs.layers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Read-only "plan" identity per environment (see docs/oidc-setup.md).
      # Client IDs are not secrets, so they are GitHub variables, not secrets.
      - name: Azure login (OIDC, no secrets)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ matrix.layer.env == 'dev' && vars.AZURE_PLAN_CLIENT_ID_DEV || matrix.layer.env == 'test' && vars.AZURE_PLAN_CLIENT_ID_TEST || vars.AZURE_PLAN_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        run: terraform -chdir="${{ matrix.layer.dir }}" init -input=false

      # -lock=false: the plan identity only has read access to state (Storage Blob Data Reader).
      - name: terraform plan
        run: |
          terraform -chdir="${{ matrix.layer.dir }}" plan -input=false -lock=false \
            -var-file="${{ matrix.layer.env }}.tfvars" -out=tfplan
          terraform -chdir="${{ matrix.layer.dir }}" show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LAYER_DIR: ${{ matrix.layer.dir }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['See job log'])[0];
            // GitHub comments are limited to 65536 characters.
            const body = [
              `### Terraform plan: \`${process.env.LAYER_DIR}\``,
              `**${summary}**`,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan.slice(0, 60000),
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
